set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g default-shell /path/to/arm64/zsh
set -s escape-time 0

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file  ~/.tmux.conf

bind -r h resize-pane -L
bind -r j resize-pane -D 
bind -r k resize-pane -U 
bind -r l resize-pane -R

bind -r m resize-pane -Z

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

set -g mouse on

set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-dir '~/.tmux/ressurect'

set -g @continuum-boot 'on'
set -g @continuum-restore 'on'

# Inherit Ghostty's light/dark palette instead of hard-coding theme colors.
set -g status-style 'fg=default,bg=default'
set -g status-left '#[fg=colour2,bold] #S #[default]'
set -g status-right '#[fg=colour8]%Y-%m-%d %H:%M | #h '
set -g window-status-style 'fg=colour8,bg=default'
set -g window-status-current-style 'fg=colour5,bg=default,bold'
set -g window-status-activity-style 'fg=colour3,bg=default'
set -g window-status-bell-style 'fg=colour1,bg=default,bold'
set -g window-status-format ' #I:#W#F '
set -g window-status-current-format ' #I:#W#F '
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour5'
set -g message-style 'fg=default,bg=default'
set -g message-command-style 'fg=default,bg=default'
set -g mode-style 'fg=colour0,bg=colour5'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
